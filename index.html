<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetKu Pro - Modern Finance System</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #f43f5e;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        /* Modern Header */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            background: #e0e7ff;
            color: var(--primary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .amount {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .card.balance .amount { color: var(--text-main); }
        .card.income .amount { color: var(--success); }
        .card.expense .amount { color: var(--danger); }

        /* Main Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .panel h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        /* Form Controls Modern */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            background: #fff;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            width: 100%;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: var(--primary-hover); }
        
        .btn-outline-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid #fecdd3;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline-danger:hover { background: #fff1f2; }

        /* Filter & Search */
        .filter-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .filter-box input, .filter-box select {
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            flex: 1;
            background: #fff;
        }

        /* Modern Table */
        .table-responsive {
            max-height: 340px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            position: sticky;
            top: 0;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .text-right { text-align: right; }
        .text-center { text-align: center; }

        .badge-income { color: var(--success); font-weight: 600; }
        .badge-expense { color: var(--danger); font-weight: 600; }
        
        .category-tag {
            font-size: 0.7rem;
            background: #f1f5f9;
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            color: var(--text-muted);
            font-weight: 500;
            display: inline-block;
            margin-top: 0.15rem;
        }

        .btn-delete {
            background: #fff1f2;
            color: var(--danger);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-delete:hover { background: var(--danger); color: white; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2.5rem 0;
            font-size: 0.9rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 0 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">💳</div>
            <div>
                <h1>DompetKu Pro</h1>
                <p>Personal Finance Dashboard</p>
            </div>
        </div>
        <button class="btn-outline-danger" onclick="resetAllData()">Reset Data</button>
    </header>

    <div class="container">
        <!-- Kartu Ringkasan -->
        <div class="summary-grid">
            <div class="card balance">
                <h3>Total Saldo</h3>
                <div class="amount" id="totalBalance">Rp 0</div>
            </div>
            <div class="card income">
                <h3>Total Pemasukan</h3>
                <div class="amount" id="totalIncome">Rp 0</div>
            </div>
            <div class="card expense">
                <h3>Total Pengeluaran</h3>
                <div class="amount" id="totalExpense">Rp 0</div>
            </div>
        </div>

        <!-- Layout Utama -->
        <div class="main-grid">
            <!-- Panel 1: Form Input -->
            <div class="panel">
                <h2>Tambah Transaksi</h2>
                <form id="transactionForm" onsubmit="addTransaction(event)">
                    <div class="form-group">
                        <label for="description">Keterangan</label>
                        <input type="text" id="description" required placeholder="Misal: Gaji Bulanan, Makan Siang">
                    </div>
                    <div class="form-group">
                        <label for="amount">Nominal (Rp)</label>
                        <input type="number" id="amount" required min="1" placeholder="Misal: 50000">
                    </div>
                    <div class="form-group">
                        <label for="type">Jenis Transaksi</label>
                        <select id="type" onchange="updateCategoryOptions()">
                            <option value="income">Pemasukan (+)</option>
                            <option value="expense">Pengeluaran (-)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category">
                            <!-- Diisi dinamis via JS -->
                        </select>
                    </div>
                    <button type="submit" class="btn">Simpan Transaksi</button>
                </form>
            </div>

            <!-- Panel 2: Riwayat & Filter -->
            <div class="panel">
                <h2>Riwayat Transaksi</h2>
                <div class="filter-box">
                    <input type="text" id="searchInput" placeholder="Cari catatan..." onkeyup="filterTransactions()">
                    <select id="filterType" onchange="filterTransactions()">
                        <option value="all">Semua</option>
                        <option value="income">Masuk</option>
                        <option value="expense">Keluar</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table id="transactionTable">
                        <thead>
                            <tr>
                                <th>Keterangan</th>
                                <th class="text-right">Nominal</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList">
                            <!-- Data dinamis -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Panel 3: Grafik Keuangan -->
            <div class="panel">
                <h2>Analisis Arus Kas</h2>
                <div style="position: relative; height: 240px; display: flex; justify-content: center; align-items: center;">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 DompetKu Pro. Desain Modern & Responsif.</p>
        </footer>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions_modern')) || [];
        let financeChart = null;

        const categories = {
            income: ['Gaji', 'Bonus', 'Investasi', 'Penjualan', 'Lainnya'],
            expense: ['Makanan & Minuman', 'Transportasi', 'Belanja', 'Tagihan', 'Hiburan', 'Lainnya']
        };

        function updateCategoryOptions() {
            const type = document.getElementById('type').value;
            const categorySelect = document.getElementById('category');
            categorySelect.innerHTML = '';
            
            categories[type].forEach(cat => {
                let opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                categorySelect.appendChild(opt);
            });
        }

        function addTransaction(e) {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;

            const newTransaction = {
                id: Date.now(),
                description,
                amount,
                type,
                category
            };

            transactions.push(newTransaction);
            saveAndRefresh();
            document.getElementById('transactionForm').reset();
            updateCategoryOptions();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(item => item.id !== id);
            saveAndRefresh();
        }

        function resetAllData() {
            if (confirm("Yakin ingin menghapus seluruh riwayat data?")) {
                transactions = [];
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('transactions_modern', JSON.stringify(transactions));
            renderApp();
        }

        function filterTransactions() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filterType = document.getElementById('filterType').value;

            let filtered = transactions.filter(item => {
                let matchKeyword = item.description.toLowerCase().includes(keyword);
                let matchType = (filterType === 'all' || item.type === filterType);
                return matchKeyword && matchType;
            });

            renderTable(filtered);
        }

        function renderTable(dataArray) {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';

            if (dataArray.length === 0) {
                list.innerHTML = `<tr><td colspan="3" class="empty-state">Belum ada catatan transaksi.</td></tr>`;
                return;
            }

            dataArray.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div style="font-weight: 500;">${item.description}</div>
                        <span class="category-tag">${item.category}</span>
                    </td>
                    <td class="text-right ${item.type === 'income' ? 'badge-income' : 'badge-expense'}">
                        ${item.type === 'income' ? '+' : '-'} Rp ${item.amount.toLocaleString('id-ID')}
                    </td>
                    <td class="text-center">
                        <button class="btn-delete" onclick="deleteTransaction(${item.id})" title="Hapus">×</button>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        function renderApp() {
            renderTable(transactions);

            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(item => {
                if (item.type === 'income') totalIncome += item.amount;
                else totalExpense += item.amount;
            });

            let totalBalance = totalIncome - totalExpense;

            document.getElementById('totalBalance').innerText = `Rp ${totalBalance.toLocaleString('id-ID')}`;
            document.getElementById('totalIncome').innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
            document.getElementById('totalExpense').innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;

            updateChart(totalIncome, totalExpense);
        }

        function updateChart(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            
            if (financeChart) financeChart.destroy();

            financeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pemasukan', 'Pengeluaran'],
                    datasets: [{
                        data: [income, expense],
                        backgroundColor: ['#10b981', '#f43f5e'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { boxWidth: 10, font: { family: 'Inter', size: 11 } }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        updateCategoryOptions();
        renderApp();
    </script>
</body>
</html>
